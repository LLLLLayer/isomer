# Release: push a v* tag → build the CLI and the desktop app, publish a
# GitHub release. The app's in-app update check reads releases/latest, so
# publishing here is what lights up the "new version" chip for users.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - name: Build ism (arm64)
        run: |
          cargo build --release -p ism-cli
          tar -C target/release -czf ism-${{ github.ref_name }}-darwin-arm64.tar.gz ism

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build desktop app
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm test
          # Stamp the app with the tag version — a mismatched app.getVersion()
          # would make every install (even the newest) see an update forever.
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm run build
          npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a re-run (or pre-created draft) uploads with --clobber
          # instead of failing on the existing release.
          gh release create "${{ github.ref_name }}" \
            --title "Isomer ${{ github.ref_name }}" \
            --generate-notes \
            ism-${{ github.ref_name }}-darwin-arm64.tar.gz \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*-mac.zip \
          || gh release upload --clobber "${{ github.ref_name }}" \
            ism-${{ github.ref_name }}-darwin-arm64.tar.gz \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*-mac.zip
